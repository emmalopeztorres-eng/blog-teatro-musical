name: Actualizar revista semanal

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-magazine
  cancel-in-progress: false

jobs:
  update-magazine:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el sitio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Leer fuentes públicas y actualizar titulares
        run: python scripts/update_magazine.py
      - name: Publicar cambios en el repositorio
        run: |
          if git diff --quiet -- actualidad.json; then
            echo "No hay titulares nuevos esta semana."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualidad.json
          git commit -m "Actualizar revista semanal"
          git push
